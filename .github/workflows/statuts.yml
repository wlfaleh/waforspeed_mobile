# WFS-196 : statuts automatiques des tickets. À la fin de chaque run de « Construction WaForSpeed » (build.yml) sur main, un
# robot passe en « ✅ Terminé (CI main #N) » les tickets 🟣 Fusionné de TACHES.md dont la fusion est dans le commit du run
# (run vert), ou note au journal le run rouge sans rien changer ; il ne devine jamais (ligne illisible → listée pour le PO).
# Le script est tools/qa/statuts.py (test : tools/qa/test_statuts.py). Il ne modifie que TACHES.md, track-agent.md et
# journal.md : ces .md sont dans paths-ignore de build.yml, et un envoi fait avec GITHUB_TOKEN ne lance aucun workflow :
# le commit du robot ne relance pas la CI.
# WFS-236 : un run « cancelled » dont seuls les jobs publication-* ont été annulés, avant d'avoir démarré, et dont tous les
# autres jobs sont verts compte comme vert (liste des jobs lue ici, décision dans statuts.py). Lancement à la main
# (workflow_dispatch, run_id) : rattrapage d'un run de main déjà terminé (RG-06).
name: Statuts automatiques

on:
  workflow_run:
    # WFS-277 (option A de l'utilisateur) : run de fusion (build.yml) vert → tickets laissés en 🟣, rouge → journal ;
    # bancs du matin (matin.yml) verts → tickets 🟣 du run en ✅ (bancs du matin #N), rouges → journal
    workflows: ["Construction WaForSpeed", "Bancs du matin (captures, réalisme, QA)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # WFS-236 (RG-06) : rattrapage d'un run de « Construction WaForSpeed » sur main déjà terminé
    inputs:
      run_id:
        description: "Identifiant du run de build.yml ou de matin.yml sur main à traiter (nombre de l'adresse …/actions/runs/<id>)"
        required: true

permissions:
  contents: write   # un commit « (robot statuts) » sur main
  actions: read     # liste des jobs en échec d'un run rouge (RG-03)

concurrency:
  group: statuts-main
  cancel-in-progress: false   # un seul run à la fois, aucun annulé : chaque run de build.yml est traité dans l'ordre

jobs:
  statuts:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # git merge-base --is-ancestor a besoin de tout l'historique

      - name: Statuts des tickets (🟣 → ✅ si le run est vert)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENEMENT: ${{ github.event.workflow_run.event }}
          NOM: ${{ github.event.workflow_run.name }}
        run: |
          set -u
          git config user.name "robot statuts"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then   # WFS-236 (RG-06) : run donné à la main
            case "$RUN_ID" in ''|*[!0-9]*) echo "::error::statuts : run_id « $RUN_ID » n'est pas un nombre"; exit 1;; esac
            INFO=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                   --jq '[.name, .head_branch, .status, (.conclusion // ""), (.run_number|tostring), .head_sha, .event] | join("\t")')
            IFS=$'\t' read -r NOM BRANCHE ETAT CONCLUSION RUN_NUMBER RUN_SHA EVENEMENT <<< "$INFO"
            if { [ "$NOM" != "Construction WaForSpeed" ] && [ "$NOM" != "Bancs du matin (captures, réalisme, QA)" ]; } || [ "$BRANCHE" != "main" ] || [ "$ETAT" != "completed" ]; then
              echo "::error::statuts : le run $RUN_ID n'est pas un run terminé de build.yml ou matin.yml sur main ($NOM, $BRANCHE, $ETAT)"
              exit 1
            fi
            echo "statuts : rattrapage du run #$RUN_NUMBER ($CONCLUSION, $EVENEMENT, $RUN_SHA)"
          fi
          # WFS-277 : source du run (fusion ou matin) et texte du statut
          if [ "$NOM" = "Bancs du matin (captures, réalisme, QA)" ]; then SOURCE=matin; LIBELLE="bancs du matin"; else SOURCE=fusion; LIBELLE="CI main"; fi
          # WFS-340 (RG-A) : bancs du matin sautés (réveil de GitHub hors de la fenêtre, ou déjà passés ce jour-là) : le run est vert
          # mais rien n'a tourné ; il ne compte ni comme vert ni comme rouge : aucun statut ne change, rien au journal
          if [ "$SOURCE" = matin ] && [ "$CONCLUSION" = success ]; then
            COMPIL=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
                     --jq '[.jobs[] | select(.name == "compilation") | .conclusion] | first // ""' || true)
            if [ "$COMPIL" != success ]; then
              echo "::notice::statuts : bancs du matin #$RUN_NUMBER sautés (compilation : ${COMPIL:-illisible}) : aucun statut changé (WFS-340)"
              exit 0
            fi
          fi
          # RG-03 : jobs en échec du run (vide si le run est vert)
          JOBS=""
          JOBS_JSON=""
          if [ "$CONCLUSION" != "success" ]; then
            JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
                   --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")' || true)
          fi
          # WFS-236 (RG-01) : run annulé : tous les jobs (toutes les pages, avec leurs étapes), un objet JSON par ligne ;
          # en cas d'erreur, fichier vide : statuts.py ne traite pas le run (RG-05 d)
          if [ "$CONCLUSION" = "cancelled" ]; then
            JOBS_JSON="$RUNNER_TEMP/jobs-$RUN_ID.json"
            gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]' \
               > "$JOBS_JSON" || : > "$JOBS_JSON"
          fi
          # RG-06 : un seul commit ; s'il croise un autre envoi, on repart de main à jour et on recalcule (5 essais)
          for essai in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/qa/statuts.py --run-number "$RUN_NUMBER" --sha "$RUN_SHA" --conclusion "$CONCLUSION" \
                    --evenement "$EVENEMENT" --jobs-en-echec "$JOBS" ${JOBS_JSON:+--jobs-json "$JOBS_JSON"} --depot . \
                    --source "$SOURCE" --libelle "$LIBELLE"
            if git diff --quiet -- TACHES.md track-agent.md journal.md; then echo "statuts : rien à envoyer"; exit 0; fi
            git add TACHES.md track-agent.md journal.md
            git commit -q -m "Statuts automatiques : $LIBELLE #$RUN_NUMBER ($CONCLUSION) (robot statuts)"
            if git push -q origin HEAD:main; then echo "statuts : envoyé (essai $essai)"; exit 0; fi
            echo "statuts : envoi refusé (essai $essai), nouvel essai"
            sleep $((essai * 5))
          done
          echo "::error::statuts : envoi sur main refusé 5 fois (protection de branche ?) : statuts non mis à jour"
          exit 1
