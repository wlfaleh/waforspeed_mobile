# Construit le jeu à chaque envoi de code :
#  - banc d'essai sur Linux (Vulkan logiciel lavapipe) : tests + captures d'écran du rendu (QA de chaque ticket),
#    découpé en jobs parallèles (WFS-69), chacun ≤ 11 min depuis WFS-106 (WFS_BANC de desktop_main.cpp)
#  - le test sur émulateur Android n'est plus lancé ici : voir simulateur.yml (vérification de fin d'épic)
#  - APK Android (arm64) et AAB signé pour Google Play (WFS-22 : clé des secrets, sinon clé factice ; store/signature.md)
#  - iOS : workflow à part (ios.yml), jamais bloquant pour celui-ci
#  - publie l'APK et les captures dans une Release d'aperçu (lien fixe) :
#      main -> « apercu » ; feature/waforspeed-XX -> « apercu-waforspeed-XX » (lancement à la main seulement, WFS-185)
#    WFS-106 : deux jobs. publication-apk part dès la fin du job android (APK en ligne ≈ 5 min après l'envoi) ;
#    publication-captures part après le banc et n'envoie que les captures changées (quota horaire de l'API commun à
#    tous les jobs du dépôt, branches comprises ; les 200 derniers appels restent aux APK)
# WFS-69 : pas de build pour la documentation seule ; un seul build par commit (l'envoi, pas la PR : les coches
# du commit s'affichent sur la PR) ; WFS-237 : sur main, un run commencé va toujours au bout, mais les fusions arrivées pendant
# ce run partagent le run suivant (un seul en attente : le plus récent, qui contient toutes les fusions).
name: Construction WaForSpeed

# WFS-185 (règle de l'utilisateur, 2026-11-06) : plus de CI sur les branches ni les PR (les lanceurs restent à main) ; le
# développeur fusionne puis valide sur la CI de main. Une branche feature/** ne se construit plus qu'à la main
# (workflow_dispatch, fusion à confiance ≤ 50 %), ses captures dans la Release apercu-waforspeed-XX.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'qa/**', 'regles-de-gestion/**', '.claude/**']
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'   # WFS-114 : banc d'endurance chaque nuit sur main (seul job lancé la nuit)

permissions:
  contents: write

concurrency:
  # branche : le nouvel envoi annule l'ancien.
  # WFS-237 (RG-01, RG-02) : main = un seul groupe (« main ») ; un run commencé n'est jamais annulé (cancel-in-progress: false) ;
  # GitHub ne garde qu'un run en attente : un envoi plus récent le remplace (il contient toutes les fusions d'avant), et le robot
  # des statuts passe en ✅ tous les tickets 🟣 dont le commit est ancêtre d'un run vert. La nuit (schedule) a son propre groupe
  # (« main-nuit ») pour qu'un envoi n'annule jamais le banc d'endurance de nuit en attente.
  group: build-${{ github.ref != 'refs/heads/main' && github.ref || github.event_name == 'schedule' && 'main-nuit' || 'main' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # WFS-250 : le jeu est compilé une seule fois par run (avant : 13 fois, une par banc et pour l'endurance) ; les bancs et
  # l'endurance reçoivent une archive tar (droits d'exécution gardés) de wfs_bench et de tous les build/test_* (shaders inclus
  # dans le binaire, CMakeLists.txt), avec la liste des tests pour vérifier à l'arrivée (tools/qa/verifier_compilation.sh)
  compilation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Outils (Vulkan logiciel, compilateur de shaders)
        # WFS-237 (RG-05) : 5 min au plus par essai, 2 essais (miroir Ubuntu parfois bloqué, WFS-126)
        run: |
          for essai in 1 2; do
            timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers ninja-build && break
            [ "$essai" = 2 ] && exit 1; echo "::warning::apt-get : essai $essai sans réponse, nouvel essai"
          done
      - name: Compilation
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Archive (wfs_bench, tests, liste des tests)
        run: |
          cd build
          ls -1 test_* | sort > liste-tests.txt
          [ -x wfs_bench ] && [ -s liste-tests.txt ] || { echo "::error::wfs_bench ou tests absents après la compilation"; exit 1; }
          tar -cf ../compilation.tar wfs_bench liste-tests.txt $(cat liste-tests.txt)
          echo "Archive : wfs_bench et $(wc -l < liste-tests.txt) tests, $(du -h ../compilation.tar | cut -f1)"
      - uses: actions/upload-artifact@v4
        with: { name: compilation, path: compilation.tar, retention-days: 1 }

  banc-essai:
    name: banc-essai (${{ matrix.groupe }})
    if: github.event_name != 'schedule'   # WFS-114 : la nuit, seul le job endurance tourne
    needs: compilation   # WFS-250
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # WFS-237 (RG-06) : banc le plus long ≈ 42 min (realisme, run #825) + 2 × 5 min d'installation au pire, et marge
    strategy:
      fail-fast: false
      matrix:
        # WFS-106 : partie1, partie2 et ecrans-2400 coupés (durées mesurées au run 41928993894), vie lancé dans texte ;
        # 11 jobs au plus 12 (machines partagées par les agents) ; nuit : WFS-09
        groupe: [partie1a, partie1b, partie2a, partie2b, partie2c, texte, ecrans-2400, menu1-2400, menu2-2400, vitrines, nuit, realisme-1, realisme-2, conduite-chocs]   # WFS-148 : banc de référence du réalisme ; WFS-252 : coupé en deux parties en parallèle (WFS-251)
    steps:
      - uses: actions/checkout@v4
      - name: Outils (Vulkan logiciel, compilateur de shaders)
        # WFS-237 (RG-05) : même boucle que le job endurance (WFS-126 : miroir Ubuntu parfois bloqué) : 5 min au plus par essai, 2 essais
        run: |
          for essai in 1 2; do
            timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers ninja-build && break
            [ "$essai" = 2 ] && exit 1; echo "::warning::apt-get : essai $essai sans réponse, nouvel essai"
          done
      - uses: actions/download-artifact@v4   # WFS-250 : jeu compilé une seule fois, par le job compilation
        with: { name: compilation }
      - name: Jeu compilé (archive du job compilation, vérifiée)
        run: mkdir -p build && tar -xf compilation.tar -C build && bash tools/qa/verifier_compilation.sh build
      - name: Test de la piste (identique au jeu web)
        if: matrix.groupe == 'texte'
        # WFS-117 : tous les build/test_* (déclarés dans CMakeLists.txt) sont lancés par le script, sans liste à tenir ici
        run: bash tools/qa/tests_cpu.sh build && python3 tools/qa/verifier_licences.py   # WFS-22 : licences
      - name: Captures du rendu (${{ matrix.groupe }})
        run: |
          mkdir -p captures
          case "${{ matrix.groupe }}" in
            partie1a|partie1b|partie2a|partie2b|partie2c|vitrines|nuit)   # vitrines : WFS-13, 16 voitures ajoutées ; nuit : WFS-09
              WFS_BANC=${{ matrix.groupe }} ./build/wfs_bench captures assets/
              # WFS-136 (accroche) : tracé 2 forcé sur les 4 cartes (rond-point, feu rouge, épingle, autoroute) ; un écart = rouge
              if [ "${{ matrix.groupe }}" = vitrines ]; then mkdir -p trace && WFS_BANC=trace ./build/wfs_bench trace assets/ && cp trace/trace-*.png captures/; fi ;;
            texte)
              # planche de test du texte (WFS-26) en 1280x720 et 2400x1080
              mkdir -p texte && WFS_BANC=texte WFS_TEXTE_ESSAI=1 ./build/wfs_bench texte assets/ > /dev/null && cp texte/course-cam0-0.png captures/texte-essai-1280.png
              WFS_BANC=texte WFS_TEXTE_ESSAI=1 WFS_TAILLE=2400x1080 ./build/wfs_bench texte assets/ > /dev/null && cp texte/course-cam0-0.png captures/texte-essai-2400.png
              mkdir -p sauv && WFS_BANC=sauvegarde ./build/wfs_bench sauv assets/ && WFS_BANC=sauvegarde ./build/wfs_bench sauv assets/ && cp sauv/fin-record.png sauv/sauvegarde-relue.png captures/   # WFS-24 : deux lancements
              # WFS-22 : manette (course pilotée par des entrées injectées, focus des menus, pause) ; journal du banc gardé
              mkdir -p manette && WFS_BANC=manette ./build/wfs_bench manette assets/ 2>&1 | grep -i "manette" | tee captures/manette-journal.txt && cp manette/manette-*.png captures/
              WFS_BANC=vie ./build/wfs_bench captures assets/   # WFS-71 (job vie jusqu'à WFS-106)
              # WFS-183 (accroche, RG-02, ANO-94) : parcours du duel en 1280x720 (salon-derniers, duel-resultat-4, salon-hors-ligne)
              mkdir -p menu1280 && WFS_BANC=menu2 ./build/wfs_bench menu1280 assets/ > /dev/null && cp menu1280/salon-derniers.png menu1280/duel-resultat-4.png menu1280/salon-hors-ligne.png captures/
              WFS_BANC=course5 ./build/wfs_bench captures assets/ ;;   # WFS-110 : modes-choix, course5-grille, course5-course, course5-fin
            ecrans-2400)
              # WFS-35 / WFS-49 : écran de chargement en 2400x1080, pris dans un lancement sans planche de texte (ANO-10)
              mkdir -p chargement && WFS_BANC=chargement WFS_TAILLE=2400x1080 ./build/wfs_bench chargement assets/ > /dev/null
              for f in chargement/chargement-*.png; do cp "$f" "captures/$(basename "$f" .png)-2400.png"; done
              mkdir -p hud && WFS_BANC=hud WFS_TAILLE=2400x1080 ./build/wfs_bench hud assets/ && cp hud/hud-course.png captures/hud-2400.png && cp hud/encoche-hud.png captures/encoche-hud-2400.png   # WFS-27, WFS-52
              for f in hud/minicarte-*.png; do cp "$f" "captures/$(basename "$f" .png)-2400.png"; done   # WFS-173 : minicarte-checkpoint-2400, minicarte-ligne-2400
              mkdir -p fluidite && WFS_BANC=fluidite ./build/wfs_bench fluidite assets/ && cp fluidite/fluidite.txt fluidite/fluidite-*-0[0-5].png captures/   # WFS-221 (accroche) : à-coups avant / après (1280x720)
              mkdir -p camera && WFS_BANC=camera WFS_TAILLE=2400x1080 ./build/wfs_bench camera assets/ && for f in camera/camera-*.png; do cp "$f" "captures/$(basename "$f" .png)-2400.png"; done ;;   # WFS-66
            menu1-2400)   # WFS-106 : 1re moitié du groupe menu en 2400x1080 (menu, appuis, pause, garage, terrain)
              mkdir -p menu && WFS_BANC=menu1 WFS_TAILLE=2400x1080 ./build/wfs_bench menu assets/ && cp menu/menu-0.png captures/menu-1.png   # WFS-37
              for f in menu/garage-*.png menu/terrain-0.png menu/terrain-1.png menu/terrain-rouler.png menu/parcours-*.png; do cp "$f" "captures/$(basename "$f" .png)-2400.png"; done   # WFS-11, WFS-41 ; WFS-135 (ANO-55) : parcours-mode / -terrain / -course
              # WFS-135 (ANO-55) : parcours complet (WFS-126) jusqu'à la fin et au retour à l'accueil ; un écart = job rouge
              mkdir -p parcours && WFS_BANC=parcours ./build/wfs_bench parcours assets/ && cp parcours/parcours-fin.png parcours/parcours-retour-menu.png captures/ ;;
            menu2-2400)   # WFS-106 : 2e moitié du groupe menu en 2400x1080 (réglages, salon du duel)
              mkdir -p menu && WFS_BANC=menu2 WFS_TAILLE=2400x1080 ./build/wfs_bench menu assets/
              for f in menu/reglages-menu.png menu/reglages-pause.png menu/menu-duel.png menu/salon-*.png menu/duel-reseau-course.png menu/duel-resultat-4.png; do cp "$f" "captures/$(basename "$f" .png)-2400.png"; done ;;   # WFS-68, WFS-83 ; WFS-122 (accroche) : duel-resultat-4
            conduite-chocs)   # WFS-252 : bancs de conduite (WFS-241) et des chocs (WFS-256) sortis d'ecrans-2400 (≈ 65 min au run #864, limite 75 min)
              mkdir -p conduite && WFS_BANC=conduite ./build/wfs_bench conduite assets/ && cp conduite/conduite.txt conduite/conduite-*.png captures/   # WFS-241 (accroche) : banc de conduite, vidéos épingle / rond-point (1280x720)
              mkdir -p chocs && WFS_BANC=chocs ./build/wfs_bench chocs assets/ && cp chocs/chocs.txt chocs/chocs-*.png captures/   # WFS-256 (accroche) : chocs avec le décor des 4 cartes
              ;;
            realisme-1|realisme-2)   # WFS-148 ; WFS-252 : une partie du banc (WFS-251) ; la texture d'essai KTX2 n'est lue que par la partie 2
              partie=${{ matrix.groupe }}; partie=${partie#realisme-}
              if [ "$partie" = 2 ]; then bash tools/textures/ci_textures.sh captures || exit 1; fi   # WFS-149 : KTX2 d'essai, rapport PSNR
              WFS_BANC=realisme WFS_REALISME_PARTIE=$partie ./build/wfs_bench captures assets/ ;;   # morceaux : captures/realisme-partie-N.morceaux
          esac
          ls -la captures
      - uses: actions/upload-artifact@v4
        with: { name: 'captures-${{ matrix.groupe }}', path: captures }

  # WFS-91 : banc d'endurance (8 cycles, 4 cartes jour / nuit, garage, pause, 3 retours d'arrière-plan, mémoire) avec les
  # couches de validation Vulkan ; en parallèle des bancs, aucune publication n'en dépend (RG-05, RG-13)
  endurance:
    # WFS-114 : seulement sur main (envoi), la nuit (schedule) et à la demande (workflow_dispatch, branches comprises) ;
    # sauté sur les envois de feature/** et claude/**
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: compilation   # WFS-250 : même binaire Release que les bancs (avant : --target wfs_bench, même réglage Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 35   # WFS-114 : ≈ 15 min (compilation ≈ 1 min, faite par le job compilation depuis WFS-250, banc 7 à 12 min sur la CI, une image sur 30) ; WFS-126 : + chauffe ≤ 4 min la nuit, et marge pour apt-get (jusqu'à 12 min vus le 2026-11-05)
    steps:
      - uses: actions/checkout@v4
      - name: Outils (Vulkan logiciel, couches de validation, compilateur de shaders)
        # WFS-126 : miroir Ubuntu parfois bloqué (run 42063069449 : apt-get update figé jusqu'à la fin du job) : 5 min au plus par essai, 2 essais
        run: |
          for essai in 1 2; do
            timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers ninja-build && break
            [ "$essai" = 2 ] && exit 1; echo "::warning::apt-get : essai $essai sans réponse, nouvel essai"
          done
      - uses: actions/download-artifact@v4   # WFS-250
        with: { name: compilation }
      - name: Jeu compilé (archive du job compilation, vérifiée)
        run: mkdir -p build && tar -xf compilation.tar -C build && bash tools/qa/verifier_compilation.sh build
      - name: Endurance
        run: tools/qa/endurance.sh ./build/wfs_bench captures assets/
      # WFS-126 (RG-07) : banc de la chauffe (WFS-123, ≈ 3 min) la nuit et à la demande seulement (le job de chaque fusion
      # n'est pas allongé) ; journal et captures chauffe-bandeau / -fin / -retabli dans l'artefact du job
      - name: Chauffe (banc WFS-123)
        if: (success() || failure()) && github.event_name != 'push'
        run: tools/qa/chauffe.sh ./build/wfs_bench captures assets/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures-endurance, path: captures }

  android:
    if: github.event_name != 'schedule'   # WFS-114 : la nuit, seul le job endurance tourne (Release apercu non republiée)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      # WFS-129 (RG-01) : SDK 35 (Android 15) installé s'il manque ; build-tools 35 pour « zipalign -P 16 » (RG-05)
      - name: NDK, CMake et SDK 35 Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Construction de l'APK et de l'AAB
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease bundleRelease   # WFS-132 : + tests JUnit (MiseAJourTest)
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk WaForSpeed.apk
      # WFS-118 (RG-05) : l'APK est signé avec la clé de test fixe du dépôt (android/waforspeed-test.keystore) ; la même
      # empreinte à chaque build permet d'installer par-dessus. Empreinte différente de celle attendue = job rouge.
      - name: Vérification de la signature de l'APK (même clé à chaque build)
        run: |
          attendue=00ee71cfe42fbe00c052a7a62aa29e1fef4f9f32079ee18f4ddde93770e11793
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs WaForSpeed.apk | tee signature.txt
          empreinte=$(grep -m1 'certificate SHA-256 digest' signature.txt | awk '{print $NF}')
          echo "Empreinte SHA-256 du certificat de l'APK : $empreinte (attendue : $attendue)"
          [ "$empreinte" = "$attendue" ] || { echo "::error::APK signé avec une autre clé que la clé de test fixe (WFS-118)"; exit 1; }
      # WFS-22 (WFS-25 RG-02) : AAB pour Google Play, signé avec la clé de publication des secrets du dépôt ; sans secret,
      # avec une clé factice jetable (vérifie la chaîne de signature). L'APK d'aperçu est signé avec la clé de test fixe (WFS-118).
      - name: Signature de l'AAB
        env:
          WFS_CLE_ANDROID: ${{ secrets.WFS_CLE_ANDROID }}
          WFS_CLE_MDP: ${{ secrets.WFS_CLE_MDP }}
          WFS_CLE_ALIAS: ${{ secrets.WFS_CLE_ALIAS }}
          WFS_CLE_ALIAS_MDP: ${{ secrets.WFS_CLE_ALIAS_MDP }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab WaForSpeed.aab
          zip -q -d WaForSpeed.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          cle="$RUNNER_TEMP/cle.jks"
          if [ -n "$WFS_CLE_ANDROID" ]; then
            echo "$WFS_CLE_ANDROID" | base64 -d > "$cle"; mdp="$WFS_CLE_MDP"; alias="$WFS_CLE_ALIAS"; amdp="${WFS_CLE_ALIAS_MDP:-$WFS_CLE_MDP}"
            echo "AAB : clé de publication (secrets du dépôt)"
          else
            mdp=factice-$GITHUB_RUN_ID; alias=factice; amdp=$mdp
            keytool -genkeypair -noprompt -keystore "$cle" -storepass "$mdp" -keypass "$amdp" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 3650 -dname "CN=WaForSpeed test, O=WaForSpeed, C=FR"
            echo "AAB : clé factice (aucun secret WFS_CLE_ANDROID)"
          fi
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$cle" -storepass "$mdp" -keypass "$amdp" WaForSpeed.aab "$alias" > /dev/null
          rm -f "$cle"
          jarsigner -verify WaForSpeed.aab | tail -1
          ls -la WaForSpeed.apk WaForSpeed.aab
      # WFS-129 (RG-05) : chaque segment LOAD de chaque .so de l'APK et de l'AAB aligné sur 2**14 (llvm-objdump du NDK),
      # et l'APK passe « zipalign -c -P 16 -v 4 » ; sinon le job est rouge (le jeu ne se chargerait pas sur un téléphone à
      # pages de 16 Ko, et Google Play refuserait l'AAB)
      - name: SDK 35 et pages de 16 Ko (bibliothèques natives et APK)
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging WaForSpeed.apk | grep -E "^(package|sdkVersion|targetSdkVersion)" | tee sdk.txt
          grep -q "targetSdkVersion:'35'" sdk.txt || { echo "::error::l'APK ne cible pas Android 15 (targetSdkVersion 35, WFS-129)"; exit 1; }
          bash tools/qa/pages_16k.sh WaForSpeed.apk WaForSpeed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            WaForSpeed.apk
            WaForSpeed.aab

  # WFS-106 RG-05 : l'APK part dès la fin du job android, sans attendre le banc ni les captures d'un autre commit ;
  # un seul à la fois par branche, jamais annulé en cours de route (RG-07 : peut attendre la remise à zéro du quota, ≤ 60 min)
  publication-apk:
    needs: [android]
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'   # WFS-185 (RG-06) : envoi sur main ou lancement à la main
    timeout-minutes: 70
    permissions: { contents: write, issues: write, actions: read }   # WFS-238 (RG-06) : Release (comme avant), commentaire de notification, runs précédents
    concurrency:
      group: apercu-apk-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dl/apk }
      - name: APK dans la Release d'aperçu (nom provisoire puis renommage, jamais de moment sans APK ; WFS-87, WFS-106)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLIER: apk
        run: bash tools/qa/publier_apercu.sh
      # WFS-238 : notification en temps réel sur le téléphone de l'utilisateur : un commentaire qui le mentionne dans l'issue épinglée
      # « 📱 Nouvel APK de main » (l'application GitHub prévient à chaque mention). Seulement sur main, seulement si CE run a publié
      # l'APK (titre de la Release = cette construction ; « APK plus récent déjà en ligne » = rien), un seul commentaire par construction,
      # aucun envoi hors de GitHub ; un échec = avertissement, jamais un job rouge (RG-07).
      - name: Notification du nouvel APK (issue « 📱 Nouvel APK de main »)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMITS: ${{ toJson(github.event.commits) }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash tools/qa/notifier_apk.sh

  # WFS-106 RG-06 : les captures après le banc (même partiel), seulement celles qui ont changé (RG-11) ; ne touchent jamais
  # à l'APK, au tag ni au titre ; échec = avertissement, job vert (RG-03) ; 20 min au plus (RG-07)
  # WFS-252 (RG-03) : rapports finaux du banc realisme (realisme-fidelite.txt, realisme-mesures.txt) assemblés à partir des deux
  # parties (WFS-251, WFS_REALISME_PARTIE=fusion) : contenu identique à celui d'un banc complet ; partie absente ou étape en double = rouge
  realisme-fusion:
    needs: [compilation, banc-essai]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Outils (Vulkan logiciel)
        run: |
          for essai in 1 2; do
            timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y libvulkan1 mesa-vulkan-drivers && break
            [ "$essai" = 2 ] && exit 1; echo "::warning::apt-get : essai $essai sans réponse, nouvel essai"
          done
      - uses: actions/download-artifact@v4
        with: { name: compilation }
      - uses: actions/download-artifact@v4
        with: { pattern: 'captures-realisme-*', path: parties }
      - name: Fusion des deux parties du banc realisme
        run: |
          mkdir -p build captures && tar -xf compilation.tar -C build && bash tools/qa/verifier_compilation.sh build
          for n in 1 2; do
            f=parties/captures-realisme-$n/realisme-partie-$n.morceaux
            [ -s "$f" ] || { echo "::error::$f absent : partie $n du banc realisme non terminée"; exit 1; }
            cp "$f" captures/
          done
          WFS_BANC=realisme WFS_REALISME_PARTIE=fusion ./build/wfs_bench captures assets/
          ls -la captures
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures-realisme, path: 'captures/*.txt' }

  publication-captures:
    needs: [banc-essai, realisme-fusion]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && github.event_name != 'schedule' }}   # WFS-185 (RG-06)
    timeout-minutes: 20
    concurrency:
      group: apercu-captures-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # aucun artefact (banc en échec) : le script le dit et finit vert
        with: { pattern: 'captures-*', path: dl/captures, merge-multiple: true }
      - name: Captures dans la Release d'aperçu (seulement celles qui ont changé ; WFS-106)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLIER: captures
          BANC: ${{ needs.banc-essai.result }}
        run: bash tools/qa/publier_apercu.sh

  # WFS-185 (RG-03) : résumé du run : commit et tickets WFS-XX des messages de commit (pour passer son ticket en ✅ avec le run)
  resume:
    name: résumé (commit et tickets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }   # WFS-237 (RG-03) : lire les runs précédents et la comparaison de commits
    steps:
      - name: Commit et tickets du run
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # WFS-237 (RG-03) : sur main, tous les commits depuis le dernier run de main qui a vraiment tourné (envoi, terminé, non annulé :
          # un run annulé en attente n'a rien vérifié), pour que le résumé liste toutes les fusions regroupées dans ce run
          liste="" ; base="" ; incomplete=""
          if [ "$GITHUB_REF_NAME" = main ]; then
            base=$(gh api "repos/$GH_REPO/actions/workflows/build.yml/runs?branch=main&event=push&status=completed&per_page=30" \
                     --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != \"cancelled\")][0].head_sha // empty" 2>/dev/null || true)
            if [ -n "$base" ]; then
              liste=$(gh api "repos/$GH_REPO/compare/$base...$GITHUB_SHA" \
                        --jq '.commits[] | .sha[0:7] + " " + (.commit.message | gsub("\n"; " ¶ "))' 2>/dev/null || true)
            fi
            [ -z "$liste" ] && incomplete=1
          fi
          tickets=$(printf '%s\n%s\n%s\n' "$COMMITS" "$HEAD_MSG" "$liste" | grep -oE 'WFS-[0-9]+' | sort -u -t- -k2,2n | tr '\n' ' ')
          {
            echo "### Run ${{ github.run_number }} (id ${{ github.run_id }})"
            echo "- commit : \`${GITHUB_SHA::7}\` sur \`${GITHUB_REF_NAME}\` (${{ github.event_name }})"
            echo "- tickets : ${tickets:-aucun}"
            if [ -n "$liste" ]; then
              echo "- commits validés depuis le dernier run de main (\`${base::7}\`) : $(printf '%s\n' "$liste" | grep -c .)"
              printf '%s\n' "$liste" | sed 's/ ¶ .*//; s/^/  - /'
            elif [ -n "$incomplete" ]; then
              echo "- liste incomplète : commits du dernier envoi seulement (dernier run de main ou comparaison illisible)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
