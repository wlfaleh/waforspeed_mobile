# Construit le jeu à chaque envoi :
#  - banc d'essai sur Linux (Vulkan logiciel lavapipe) : tests + captures d'écran du rendu (QA de chaque ticket)
#  - le test sur émulateur Android n'est plus lancé ici : voir simulateur.yml (vérification de fin d'épic)
#  - APK Android (arm64)
#  - publie l'APK et les captures dans une Release d'aperçu (lien fixe) :
#      main -> « apercu » ; feature/waforspeed-XX -> « apercu-waforspeed-XX » (pour valider le ticket avant fusion)
name: Construction WaForSpeed

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc-essai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils (Vulkan logiciel, compilateur de shaders)
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers ninja-build
      - name: Compilation
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Test de la piste (identique au jeu web)
        run: ./build/test_track && ./build/test_systems && ./build/test_traffic tests/trafic_web_ref.txt && ./build/test_course tests/course_web_ref.txt && ./build/test_audio assets
      - name: Captures du rendu
        run: |
          mkdir -p captures
          ./build/wfs_bench captures assets/
          # planche de test du texte (WFS-26) en 1280x720 et 2400x1080
          mkdir -p texte && WFS_TEXTE_ESSAI=1 ./build/wfs_bench texte assets/ > /dev/null && cp texte/course-cam0-0.png captures/texte-essai-1280.png
          WFS_TEXTE_ESSAI=1 WFS_TAILLE=2400x1080 ./build/wfs_bench texte assets/ > /dev/null && cp texte/course-cam0-0.png captures/texte-essai-2400.png
          mkdir -p hud && WFS_BANC=hud WFS_TAILLE=2400x1080 ./build/wfs_bench hud assets/ && cp hud/hud-course.png captures/hud-2400.png   # WFS-27
          ls -la captures
      - uses: actions/upload-artifact@v4
        with: { name: captures, path: captures }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: NDK et CMake Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Construction de l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk WaForSpeed.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: WaForSpeed.apk }

  publication:
    needs: [banc-essai, android]
    runs-on: ubuntu-24.04
    if: always() && needs.android.result == 'success' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Release d'aperçu (remplacée à chaque construction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apercu
          case "$GITHUB_REF_NAME" in feature/*) tag="apercu-${GITHUB_REF_NAME#feature/}";; claude/*) tag="apercu-${GITHUB_REF_NAME#claude/}";; esac
          gh release delete "$tag" -y --cleanup-tag || true
          files="dl/apk/WaForSpeed.apk"
          # les fichiers vides (capture ratée) sont ignorés : ils ne doivent pas empêcher la publication
          if [ -d dl/captures ]; then for f in dl/captures/*.png; do [ -s "$f" ] && files="$files $f"; done; fi
          gh release create "$tag" $files --prerelease --target "$GITHUB_SHA" \
            --title "Aperçu — construction ${GITHUB_RUN_NUMBER}" \
            --notes "APK Android de test (arm64). Installer : télécharger WaForSpeed.apk sur le téléphone, autoriser l'installation depuis cette source. Branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}."
