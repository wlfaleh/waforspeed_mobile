plugins { id 'com.android.application' }

// WFS-404 (RG-01, RG-02) : voitures retirées de l'application (licence non commerciale) : liste unique VOITURES_RETIREES de
// src/game/cars.h, relue ici ; leurs modèles (.wfm, .lod) restent dans assets/cars/ du dépôt mais ne sont pas copiés dans l'APK
def voituresRetirees = {
    def ligne = file('../../src/game/cars.h').readLines().find { it.contains('VOITURES_RETIREES[] =') }
    if (ligne == null) throw new GradleException('WFS-404 : VOITURES_RETIREES introuvable dans src/game/cars.h')
    (ligne.substring(ligne.indexOf('{')) =~ /"([\w-]+)"/).collect { it[1] }
}()
// motifs d'aapt : ceux d'Android par défaut, puis les fichiers des voitures retirées : modèles et licences (le « ! » les écarte sans avertissement)
def motifsIgnores = (['!.svn', '!.git', '!.ds_store', '!*.scc', '.*', '<dir>_*', '!CVS', '!thumbs.db', '!picasa.ini', '!*~'] +
                     voituresRetirees.collectMany { ["!${it}.wfm", "!${it}.lod", "!${it}.txt"] }).join(':')

android {
    namespace 'com.waforspeed.game'
    compileSdk 35   // WFS-129 (RG-01) : Android 15, exigé par Google Play pour les nouvelles applications et les mises à jour
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.waforspeed.game'
        minSdk 26
        targetSdk 35   // WFS-129 (RG-01) ; minSdk 26 inchangé
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }   // x86_64 : émulateur de la QA automatique
        // WFS-129 (RG-04) : segments LOAD de libwaforspeed.so alignés sur 16 Ko (téléphones à pages de 16 Ko, exigé par
        // Google Play avec Android 15) : variable du NDK r27, qui ajoute -Wl,-z,max-page-size=16384 à l'édition des liens
        // WFS-279 : versionName (seule source de la version) passé au code natif : affiché à l'écran de chargement
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DWFS_VERSION=${android.defaultConfig.versionName}" } }
    }
    externalNativeBuild {
        cmake { path '../../CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets {
        main { assets.srcDirs = ['../../assets', "$buildDir/generated/configgame"] }   // WFS-128 : + configgame.json
    }
    // WFS-118 : clé de test fixe du dépôt (android/keystore.properties) au lieu de la clé de debug, recréée sur chaque
    // machine de la CI ; même signature à chaque build, l'APK s'installe par-dessus. Jamais pour le store (RG-03).
    signingConfigs {
        test {
            def p = new Properties()
            file('../keystore.properties').withInputStream { p.load(it) }
            storeFile file(p['storeFile']); storeType p['storeType']
            storePassword p['storePassword']; keyAlias p['keyAlias']; keyPassword p['keyPassword']
        }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false; signingConfig signingConfigs.test }
    }
    androidResources { noCompress 'wfm', 'wav'; ignoreAssetsPattern motifsIgnores }   // WFS-404 : sans les voitures retirées
    // WFS-129 (RG-04) : bibliothèques natives non compressées, alignées sur 16 Ko dans l'APK (vérifié par la CI : zipalign -P 16)
    packagingOptions { jniLibs { useLegacyPackaging false } }
}

// WFS-128 : configgame.json (racine du dépôt) copié dans des assets générés (jamais toute la racine dans l'APK)
tasks.register('copierConfiggame', Copy) {
    from '../../configgame.json'; into "$buildDir/generated/configgame"
    from('../../store') { include 'cgu.md', 'confidentialite.md'; into 'cgu' }   // WFS-308 (RG-03) : textes des CGU dans l'APK (assets cgu/)
}
preBuild.dependsOn 'copierConfiggame'

// WFS-404 (RG-01) : contrôle à la construction : aucun modèle d'une voiture retirée dans les actifs fusionnés de l'APK
tasks.configureEach { t ->
    if (t.name ==~ /merge(Debug|Release)Assets/) t.doLast {
        def restes = fileTree(t.outputDir.get().asFile).matching { voituresRetirees.each { v -> include "**/${v}.wfm", "**/${v}.lod" } }.files
        if (!restes.isEmpty()) throw new GradleException("WFS-404 : voitures retirées encore dans l'APK : ${restes*.name}")
        logger.lifecycle("WFS-404 : voitures retirées hors de l'APK : ${voituresRetirees}")
    }
}

// WFS-132 (RG-08) : test JUnit de la règle de mise à jour (MiseAJourTest, lancé par la CI : testReleaseUnitTest)
dependencies { testImplementation 'junit:junit:4.13.2' }
