plugins { id 'com.android.application' }

android {
    namespace 'com.waforspeed.game'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.waforspeed.game'
        minSdk 26
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' } }
    }
    externalNativeBuild {
        cmake { path '../../CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets {
        main { assets.srcDirs = ['../../assets'] }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    androidResources { noCompress 'wfm', 'wav' }
    packagingOptions { jniLibs { useLegacyPackaging false } }
}
