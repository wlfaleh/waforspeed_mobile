org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# WFS-129 (RG-01) : SDK 35 avec l'AGP 8.5.2 (pas de montée d'AGP sans raison) : avertissement « compileSdk non testé » coupé
android.suppressUnsupportedCompileSdk=35
# WFS-511 : Google Play Billing 8 tire des bibliothèques AndroidX (play-services-base) : sans ce réglage, l'AGP arrête
# assembleRelease / bundleRelease (ANDROID_X_PROPERTY_NOT_ENABLED)
android.useAndroidX=true
